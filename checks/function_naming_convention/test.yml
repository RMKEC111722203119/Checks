test_id: T02
test_name: Function Naming Convention
test_version: 1.0.0
description: Checks function, method, SQL function and macro names against language-specific naming conventions.
entrypoint: T02_function_naming_convention.py
severity: High
confidence: Certain
category: Naming Convention
supported_extensions:
  - .py
  - .ipynb
  - .sql
  - .js
  - .jsx
  - .ts
  - .tsx
timeout_seconds: 180
enabled_by_default: true
parameters:
  styles:
    python: snake_case
    sql: snake_case
    javascript: camelCase
    typescript: camelCase
  custom_patterns: {}
  maximum_length: 60
  allow_leading_underscore: true
  ignore_dunder_methods: true
  ignored_names:
    - setUp
    - tearDown
    - setUpClass
    - tearDownClass
